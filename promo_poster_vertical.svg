<svg width="1200" height="1800" viewBox="0 0 1200 1800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1120" y2="1700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFE4D2"/>
      <stop offset="0.48" stop-color="#F8F3EA"/>
      <stop offset="1" stop-color="#E7D7C0"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="180" x2="1080" y2="1640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9" stop-opacity="0.92"/>
