    </linearGradient>
    <filter id="shadow" x="88" y="148" width="1024" height="1494" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#4C3816" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="1800" fill="url(#bg)"/>
  <circle cx="140" cy="180" r="220" fill="#B98948" fill-opacity="0.15"/>
  <circle cx="1060" cy="220" r="140" fill="#B98948" fill-opacity="0.08"/>
  <circle cx="1020" cy="1520" r="220" fill="#B98948" fill-opacity="0.08"/>

  <g filter="url(#shadow)">
