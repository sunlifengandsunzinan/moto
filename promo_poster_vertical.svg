    <rect x="120.5" y="170.5" width="959" height="1429" rx="35.5" stroke="#8D6634" stroke-opacity="0.14"/>
  </g>

  <rect x="180" y="228" width="420" height="60" rx="30" fill="#FFFFFF" fill-opacity="0.78" stroke="#8D6634" stroke-opacity="0.12"/>
