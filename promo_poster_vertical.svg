    <text x="220" y="930" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28">经典路线、亮点、行程</text>
    <text x="220" y="972" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28">一眼看完。</text>

    <rect x="620" y="748" width="400" height="170" rx="28" fill="#FFFFFF" fill-opacity="0.82" stroke="#8D6634" stroke-opacity="0.14"/>
    <text x="660" y="806" fill="#9D6A2A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="24">02</text>
    <text x="660" y="872" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="42" font-weight="700">导航衔接</text>
    <text x="660" y="930" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28">高德逐点导航，</text>
    <text x="660" y="972" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28">路上更省心。</text>
  </g>

  <g>
