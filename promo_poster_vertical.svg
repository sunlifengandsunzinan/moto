    <rect x="365" y="1134" width="470" height="470" rx="26" fill="#FFFFFF" stroke="#9D6A2A" stroke-width="3" stroke-dasharray="16 12"/>
    <text x="515" y="1338" fill="#9D6A2A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">小程序</text>
    <text x="542" y="1408" fill="#9D6A2A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">二维码</text>
  </g>

  <g>
