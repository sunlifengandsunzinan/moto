  <text x="180" y="410" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="96" font-weight="700">辽宁摩旅路线</text>
  <text x="180" y="522" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="96" font-weight="700">导航 打卡 养车</text>

  <text x="180" y="622" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="34">给辽宁摩友日常转发用的一张图：</text>
  <text x="180" y="676" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="34">看路线、查补给、接高德、记想去、做打卡。</text>

