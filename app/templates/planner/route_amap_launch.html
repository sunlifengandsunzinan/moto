<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{{ route_title }} 打开高德导航</title>
    <style>
      :root {
        --paper: #f6efe4;
        --sheet: rgba(255, 250, 244, 0.98);
        --ink: #4a433e;
        --muted: #8a7a6b;
        --line: rgba(91, 83, 77, 0.12);
        --accent: #d1aa82;
        --accent-deep: #7a5c3c;
        --shadow: 0 -18px 44px rgba(62, 49, 39, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(circle at top center, rgba(209, 170, 130, 0.22), transparent 34%),
          linear-gradient(180deg, #f8f1e7 0%, #f1e5d5 100%);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .launch-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px 20px;
      }

      .launch-badge {
        width: 88px;
        height: 88px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.82) 0%, rgba(247, 239, 228, 0.92) 100%);
        box-shadow: 0 16px 36px rgba(97, 76, 53, 0.12);
      }

      .launch-badge::before {
        content: "高德";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 58px;
        border-radius: 20px;
        background: linear-gradient(180deg, #ffe186 0%, #ffd05e 100%);
        color: #5a4118;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .launch-sheet {
        padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
        border-top-left-radius: 28px;
        border-top-right-radius: 28px;
        border-top: 1px solid rgba(91, 83, 77, 0.08);
        background: var(--sheet);
        box-shadow: var(--shadow);
      }

      .sheet-handle {
        width: 72px;
        height: 6px;
        margin: 0 auto 18px;
        border-radius: 999px;
        background: rgba(91, 83, 77, 0.14);
      }

      .sheet-eyebrow {
        color: var(--accent-deep);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 10px 0 0;
        font-size: 22px;
        line-height: 1.35;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 14px;
      }

      .status-box {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 18px;
        border: 1px solid rgba(209, 170, 130, 0.22);
        background: rgba(247, 239, 228, 0.88);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.6;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 20px;
      }

      .action {
        appearance: none;
        border: 1px solid rgba(91, 83, 77, 0.12);
        border-radius: 18px;
        min-height: 52px;
        padding: 0 18px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .action-primary {
        background: #4f4a46;
        color: #fbf7f0;
      }

      .action-secondary {
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
      }

      .sheet-footnote {
        margin-top: 14px;
        color: #9b8a79;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <section class="launch-stage">
      <div class="launch-badge" aria-hidden="true"></div>
    </section>

    <section class="launch-sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-eyebrow">高德导航</div>
      <h1>{{ route_title }}</h1>
      <p>正在为你打开高德地图。若当前环境无法直接唤起 App，可继续改用网页查看这条路线。</p>

      <div class="status-box" id="statusBox">正在尝试打开高德 App...</div>

      <div class="actions">
        <button type="button" class="action action-primary" id="retryAppButton">打开高德 App</button>
        <a class="action action-secondary" href="{{ amap_export.browser_href }}">改用网页打开高德</a>
      </div>

      <div class="sheet-footnote">如果你当前在微信开发者工具里，这里不会真的唤起手机上的高德 App，真机测试才会走到那条链路。</div>
    </section>

    <script>
      const appHref = {{ amap_export.href|tojson }};
      const browserHref = {{ amap_export.browser_href|tojson }};
      const statusBox = document.getElementById("statusBox");
      const retryAppButton = document.getElementById("retryAppButton");

      function updateStatus(text) {
        statusBox.textContent = text;
      }

      function isDevtools() {
        return /wechatdevtools/i.test(window.navigator.userAgent || "");
      }

      function tryOpenApp() {
        if (!appHref) {
          updateStatus("当前路线还没有可用的高德导航链接。");
          return;
        }

        updateStatus("正在尝试打开高德 App，请稍候...");
        window.location.href = appHref;

        window.setTimeout(() => {
          updateStatus("如果没有跳转到高德 App，说明当前环境拦截了第三方 App 唤起。你可以继续用网页打开高德路线。");
        }, 1400);
      }

      retryAppButton.addEventListener("click", tryOpenApp);

      if (isDevtools()) {
        updateStatus("当前在微信开发者工具里，无法验证第三方 App 唤起。请在真机中测试，或先用网页打开高德路线。");
      } else {
        tryOpenApp();
      }
    </script>
  </body>
</html>
