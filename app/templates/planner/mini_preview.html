{% extends "base.html" %}

{% block title %}小程序预览{% endblock %}

{% block body_class %}miniapp-body{% endblock %}

{% block content %}
  <main class="miniapp-shell">
    <section class="miniapp-page miniapp-page--with-tabbar miniapp-preview-page" data-mini-preview>
      <header class="miniapp-topbar">
        <div>
          <p class="miniapp-topbar__eyebrow">预览</p>
          <h1>小程序前端预览</h1>
        </div>
        <div class="miniapp-inline-badge" data-preview-status>正在加载</div>
      </header>

      <section class="miniapp-card miniapp-card--hero">
        <p class="miniapp-card__desc">浏览器里先模拟小程序的两页切换，数据直接来自 Flask 的 JSON 接口。</p>
        <div class="miniapp-quick-actions miniapp-preview-switches">
          <button class="miniapp-button" type="button" data-preview-tab="routes">路线</button>
          <button class="miniapp-button miniapp-button--secondary" type="button" data-preview-tab="me">我的</button>
        </div>
      </section>

      <section data-preview-content></section>

      <nav class="miniapp-tabbar" aria-label="底部导航">
        <button class="miniapp-tabbar__item is-active" type="button" data-preview-tab="routes">路线</button>
        <button class="miniapp-tabbar__item" type="button" data-preview-tab="me">我的</button>
      </nav>
    </section>
  </main>

  <script>
    (() => {
      const content = document.querySelector('[data-preview-content]');
      const status = document.querySelector('[data-preview-status]');
      const shell = document.querySelector('[data-mini-preview]');
      const tabButtons = shell.querySelectorAll('[data-preview-tab]');
      const endpointByTab = {
        routes: '/api/moto/routes',
        me: '/api/moto/me',
      };
      let activeTab = 'routes';
      let activeDuration = '1-2-days';
      let activeView = 'tab';
      let activeRouteSlug = '';

      const durationFilters = [
        { key: '1-day', label: '1天' },
        { key: '1-2-days', label: '1-2天' },
        { key: '2-3-days', label: '2-3天' },
        { key: '3-plus-days', label: '3天以上' },
      ];

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function renderTags(items = [], accent = false) {
        if (!items.length) return '';
        return `
          <ul class="miniapp-tag-row miniapp-tag-row--compact${accent ? ' miniapp-tag-row--accent' : ''}">
            ${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}
          </ul>
        `;
      }

      function matchesDuration(days, filterKey) {
        if (filterKey === '1-day') return days <= 1;
        if (filterKey === '1-2-days') return days > 1 && days <= 2;
        if (filterKey === '2-3-days') return days > 2 && days <= 3;
        if (filterKey === '3-plus-days') return days > 3;
        return true;
      }

      function routeDetailEndpoint(slug) {
        return `/api/moto/routes/${encodeURIComponent(slug)}`;
      }

      function routeScreenshotUrl(amapExport = {}) {
        return amapExport.screenshot_url || amapExport.screenshot_href || '';
      }

      function routeGpxDownloadUrl(route = {}) {
        return route.gpx?.download_href || '';
      }

      function renderRouteDetail(payload) {
        const route = payload.route || {};
        const dailyPlan = payload.detail_sections?.daily_plan || [];
        const screenshotUrl = routeScreenshotUrl(route.amap_export || {});
        const gpx = route.gpx || {};
        return `
          <section class="miniapp-card miniapp-card--hero miniapp-route-detail-hero">
            <div class="miniapp-actions miniapp-actions--compact">
              <button class="miniapp-button miniapp-button--ghost" type="button" data-preview-back-to-routes>返回路线</button>
            </div>
            <div class="miniapp-inline-meta">
              <span>路线详情</span>
              <strong>${escapeHtml(payload.page?.title || route.title || '')}</strong>
            </div>
          </section>
          <section class="miniapp-card miniapp-route-detail-shot">
            <div class="miniapp-section-header">
              <div>
                <p class="miniapp-section-header__eyebrow">路线截图</p>
                <h2>高德路线截图</h2>
              </div>
            </div>
            ${screenshotUrl ? `
              <img class="miniapp-route-detail-shot__image" src="${escapeHtml(screenshotUrl)}" alt="${escapeHtml(route.title || '路线')} 高德路线截图">
              <p class="miniapp-card__subtle miniapp-route-detail-inline">途径点路线截图，可用于高德路线预览。</p>
            ` : `
              <p class="miniapp-card__desc">当前没有可展示的路线截图。</p>
            `}
          </section>
          ${gpx.is_available ? `
            <section class="miniapp-card miniapp-route-detail-schedule">
              <div class="miniapp-section-header">
                <div>
                  <p class="miniapp-section-header__eyebrow">GPX 同步</p>
                  <h2>提取轨迹</h2>
                </div>
                <span class="miniapp-route-detail-meta">GPX</span>
              </div>
              <p class="miniapp-list-card__title">${escapeHtml(gpx.source_title || '')}</p>
              ${gpx.meta_text ? `<p class="miniapp-card__subtle">${escapeHtml(gpx.meta_text)}</p>` : ''}
              <div class="miniapp-tag-row miniapp-tag-row--compact miniapp-route-gpx-strip-list">
                ${(gpx.facts || []).map((fact) => `
                  <span class="miniapp-route-gpx-strip-item"><strong>${escapeHtml(fact.label)}</strong>${escapeHtml(fact.value)}</span>
                `).join('')}
              </div>
              <div class="miniapp-actions miniapp-actions--compact">
                ${route.amap_export?.is_available ? `<button class="miniapp-button miniapp-button--secondary" type="button" data-direct-nav="${escapeHtml(route.amap_export.href)}">直接导航</button>` : ''}
                <a class="miniapp-button miniapp-button--secondary" href="${escapeHtml(routeGpxDownloadUrl(route))}" target="_blank" rel="noreferrer">GPX 文件下载</a>
              </div>
            </section>
          ` : ''}
          <section class="miniapp-card miniapp-route-detail-schedule">
            <div class="miniapp-section-header">
              <div>
                <p class="miniapp-section-header__eyebrow">示例日程</p>
                <h2>${escapeHtml(route.days || dailyPlan.length || '')} 天路书拆分</h2>
              </div>
              <span class="miniapp-route-detail-meta">沿途节奏</span>
            </div>
            <div class="miniapp-route-stage-list">
              ${dailyPlan.map((day) => `
                <article class="miniapp-route-stage-item miniapp-route-stage-item--detail">
                  <span class="miniapp-route-stage-day">Day ${escapeHtml(day.day)}</span>
                  <div class="miniapp-route-stage-track">
                    <span class="miniapp-route-stage-marker"></span>
                    <div class="miniapp-route-day-card">
                      <p class="miniapp-route-stage-title">${escapeHtml(day.title)}</p>
                      <p class="miniapp-card__subtle">${escapeHtml(day.ride_time || '')}${day.ride_time && day.distance ? ' · ' : ''}${escapeHtml(day.distance || '')}</p>
                      ${(day.highlights || []).length ? `<p class="miniapp-card__subtle">${escapeHtml((day.highlights || []).join(' · '))}</p>` : ''}
                      <p class="miniapp-card__desc">${escapeHtml(day.note || '')}</p>
                    </div>
                  </div>
                </article>
              `).join('') || '<p class="miniapp-card__desc">当前没有可展示的示例日程。</p>'}
            </div>
          </section>
        `;
      }

      function renderRoutes(payload) {
        const routes = (payload.routes || []).filter((route) => matchesDuration(Number(route.days || 0), activeDuration));
        return `
          <section class="miniapp-route-filter-strip">
            <div class="miniapp-chip-row miniapp-route-chip-row">
              ${durationFilters.map((item) => `
                <button class="miniapp-chip ${item.key === activeDuration ? 'is-active' : ''}" type="button" data-route-duration="${escapeHtml(item.key)}">${escapeHtml(item.label)}</button>
              `).join('')}
            </div>
          </section>
          <section class="miniapp-list">
            ${routes.map((route) => `
              <article class="miniapp-card miniapp-list-card miniapp-route-card-v2" data-preview-route="${escapeHtml(route.slug)}">
                <div class="miniapp-route-roadbar">
                  <span class="miniapp-route-roadbar__label">ROADBOOK</span>
                  <span class="miniapp-route-roadbar__lane"></span>
                </div>
                <div class="miniapp-list-card__header">
                  <div>
                    <p class="miniapp-list-card__title">${escapeHtml(route.title)}</p>
                  </div>
                  <div class="miniapp-route-meta-pill">${escapeHtml(route.distance_km)} km</div>
                </div>
                <p class="miniapp-card__subtle">${escapeHtml(route.days)} 天 · ${escapeHtml(route.waypoint_count)} 个途径点</p>
                ${route.gpx?.is_available ? `
                  <div class="miniapp-inline-meta">
                    <span>GPX</span>
                    <strong>${escapeHtml(route.gpx.source_title || '')}</strong>
                  </div>
                  ${route.gpx.meta_text ? `<p class="miniapp-card__subtle">${escapeHtml(route.gpx.meta_text)}</p>` : ''}
                ` : ''}
                <section class="miniapp-route-stage-block">
                  <div class="miniapp-section-header">
                    <div>
                      <p class="miniapp-card__subtle">${escapeHtml(route.days)} 天路线拆分</p>
                    </div>
                  </div>
                  <div class="miniapp-route-stage-list">
                    ${(route.days_plan || []).map((day) => `
                      <article class="miniapp-route-stage-item">
                        <span class="miniapp-route-stage-day">Day ${escapeHtml(day.day)}</span>
                        <div class="miniapp-route-stage-track">
                          <span class="miniapp-route-stage-marker"></span>
                          <div>
                            <p class="miniapp-route-stage-title">${escapeHtml(day.title)}</p>
                            <p class="miniapp-card__subtle">约 ${escapeHtml(day.distance)} km</p>
                          </div>
                        </div>
                      </article>
                    `).join('')}
                  </div>
                </section>
                ${route.amap_export?.is_available || route.gpx?.is_available ? `
                  <div class="miniapp-actions miniapp-actions--compact">
                    ${route.amap_export?.is_available ? `<button class="miniapp-button miniapp-button--secondary" type="button" data-direct-nav="${escapeHtml(route.amap_export.href)}">直接导航</button>` : ''}
                    ${route.gpx?.is_available ? `<a class="miniapp-button miniapp-button--secondary" href="${escapeHtml(routeGpxDownloadUrl(route))}" target="_blank" rel="noreferrer">GPX 文件下载</a>` : ''}
                  </div>
                ` : ''}
              </article>
            `).join('') || `
              <article class="miniapp-card miniapp-list-card">
                <p class="miniapp-list-card__title">暂无路线</p>
              </article>
            `}
          </section>
        `;
      }

      function renderMe(payload) {
        const metrics = payload.metrics || [];
        const sections = payload.sections || [];
        const quickActions = payload.quick_actions || [];
        return `
          <section class="miniapp-card miniapp-profile-card miniapp-profile-card--hero">
            <div class="miniapp-profile-card__top">
              <div class="miniapp-profile-card__avatar">骑</div>
              <div>
                <p class="miniapp-profile-card__name">${escapeHtml(payload.profile?.name)}</p>
                <p class="miniapp-profile-card__tagline">${escapeHtml(payload.profile?.tagline)}</p>
              </div>
            </div>
            <p class="miniapp-card__desc">${escapeHtml(payload.profile?.summary)}</p>
            <div class="miniapp-chip-row miniapp-profile-chip-row">
              ${metrics.map((metric) => `<span class="miniapp-chip">${escapeHtml(metric.label)} ${escapeHtml(metric.value)}</span>`).join('')}
            </div>
          </section>
          <section class="miniapp-profile-action-grid">
            ${quickActions.map((action) => `
              <a class="miniapp-card miniapp-profile-action-card" href="${escapeHtml(action.href)}" target="_blank" rel="noreferrer">
                <span class="miniapp-profile-action-card__eyebrow">快捷入口</span>
                <strong>${escapeHtml(action.label)}</strong>
                <span>${action.kind === 'primary' ? '优先入口' : '备选入口'}</span>
              </a>
            `).join('')}
          </section>
          <section class="miniapp-card miniapp-profile-summary-card">
            <div class="miniapp-section-header">
              <div>
                <p class="miniapp-section-header__eyebrow">路线概览</p>
                <h2>当前小程序焦点</h2>
              </div>
            </div>
            <section class="miniapp-stat-grid miniapp-stat-grid--cards">
              ${metrics.map((metric) => `
                <article class="miniapp-card miniapp-metric-card">
                  <strong>${escapeHtml(metric.value)}</strong>
                  <span>${escapeHtml(metric.label)}</span>
                </article>
              `).join('')}
            </section>
          </section>
          ${sections.map((section) => `
            <section class="miniapp-card miniapp-profile-section-card">
              <div class="miniapp-section-header">
                <div>
                  <p class="miniapp-section-header__eyebrow">我的路线</p>
                  <h2>${escapeHtml(section.title)}</h2>
                </div>
              </div>
              <div class="miniapp-list miniapp-profile-entry-list">
                ${(section.items || []).map((item) => `
                  <a class="miniapp-entry-row miniapp-entry-row--card" href="${escapeHtml(item.href)}" target="_blank" rel="noreferrer">
                    <div>
                      <p class="miniapp-entry-row__title">${escapeHtml(item.label)}</p>
                      <p class="miniapp-card__subtle">${escapeHtml(item.description)}</p>
                    </div>
                    <span class="miniapp-entry-row__arrow">进入</span>
                  </a>
                `).join('')}
              </div>
            </section>
          `).join('')}
        `;
      }

      function setActiveButtons() {
        tabButtons.forEach((button) => {
          const active = button.dataset.previewTab === activeTab;
          button.classList.toggle('is-active', active);
          if (button.classList.contains('miniapp-button')) {
            button.classList.toggle('miniapp-button--secondary', !active);
          }
        });
      }

      function bindRouteInteractions() {
        content.querySelectorAll('[data-route-duration]').forEach((button) => {
          button.addEventListener('click', () => {
            activeDuration = button.dataset.routeDuration || '1-2-days';
            loadTab('routes');
          });
        });
        content.querySelectorAll('[data-preview-route]').forEach((button) => {
          button.addEventListener('click', () => {
            loadRouteDetail(button.dataset.previewRoute || '');
          });
        });
        content.querySelectorAll('[data-direct-nav]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const href = button.dataset.directNav || '';
            if (href) {
              window.open(href, '_blank', 'noopener,noreferrer');
            }
          });
        });
        content.querySelectorAll('[data-preview-back-to-routes]').forEach((button) => {
          button.addEventListener('click', () => {
            activeView = 'tab';
            activeRouteSlug = '';
            loadTab('routes');
          });
        });
      }

      async function loadTab(tab, extraQuery = {}) {
        activeTab = tab;
        activeView = 'tab';
        activeRouteSlug = '';
        setActiveButtons();
        status.textContent = '加载中';
        content.innerHTML = '<section class="miniapp-card"><p class="miniapp-card__desc">正在拉取数据...</p></section>';

        try {
          const query = new URLSearchParams(extraQuery).toString();
          const endpoint = query ? `${endpointByTab[tab]}?${query}` : endpointByTab[tab];
          const response = await fetch(endpoint);
          const payload = await response.json();

          if (!response.ok) {
            throw new Error('接口加载失败');
          }

          status.textContent = tab === 'routes' ? '路线' : '我的';
          if (tab === 'routes') content.innerHTML = renderRoutes(payload);
          if (tab === 'me') content.innerHTML = renderMe(payload);
          if (tab === 'routes') bindRouteInteractions();
        } catch (error) {
          status.textContent = '异常';
          content.innerHTML = `<section class="miniapp-card"><p class="miniapp-card__desc">${escapeHtml(error.message || '预览加载失败')}</p></section>`;
        }
      }

      async function loadRouteDetail(slug) {
        if (!slug) return;
        activeTab = 'routes';
        activeView = 'detail';
        activeRouteSlug = slug;
        setActiveButtons();
        status.textContent = '加载中';
        content.innerHTML = '<section class="miniapp-card"><p class="miniapp-card__desc">正在拉取路线详情...</p></section>';

        try {
          const response = await fetch(routeDetailEndpoint(slug));
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.message || '路线详情加载失败');
          }
          status.textContent = '路线详情';
          content.innerHTML = renderRouteDetail(payload);
          bindRouteInteractions();
        } catch (error) {
          status.textContent = '异常';
          content.innerHTML = `<section class="miniapp-card"><p class="miniapp-card__desc">${escapeHtml(error.message || '路线详情加载失败')}</p></section>`;
        }
      }

      tabButtons.forEach((button) => {
        button.addEventListener('click', () => {
          activeDuration = '1-2-days';
          loadTab(button.dataset.previewTab);
        });
      });

      loadTab(activeTab);
    })();
  </script>
{% endblock %}
