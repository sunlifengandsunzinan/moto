<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{{ route_title }} 打开腾讯导航</title>
    <style>
      :root {
        --paper: #eef4ff;
        --sheet: rgba(248, 251, 255, 0.98);
        --ink: #2c3f5a;
        --muted: #667a97;
        --line: rgba(76, 106, 151, 0.14);
        --accent: #5d8fe8;
        --accent-deep: #2d5dba;
        --shadow: 0 -18px 44px rgba(47, 79, 132, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(circle at top center, rgba(93, 143, 232, 0.24), transparent 36%),
          linear-gradient(180deg, #f2f7ff 0%, #e7f0ff 100%);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .launch-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px 20px;
      }

      .launch-badge {
        width: 88px;
        height: 88px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(240, 247, 255, 0.96) 100%);
        box-shadow: 0 16px 36px rgba(57, 88, 142, 0.15);
      }

      .launch-badge::before {
        content: "腾讯";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 58px;
        border-radius: 20px;
        background: linear-gradient(180deg, #6fa7ff 0%, #3f82ea 100%);
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .launch-sheet {
        padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
        border-top-left-radius: 28px;
        border-top-right-radius: 28px;
        border-top: 1px solid rgba(76, 106, 151, 0.1);
        background: var(--sheet);
        box-shadow: var(--shadow);
      }

      .sheet-handle {
        width: 72px;
        height: 6px;
        margin: 0 auto 18px;
        border-radius: 999px;
        background: rgba(76, 106, 151, 0.16);
      }

      .sheet-eyebrow {
        color: var(--accent-deep);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 10px 0 0;
        font-size: 22px;
        line-height: 1.35;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 14px;
      }

      .status-box {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 18px;
        border: 1px solid rgba(93, 143, 232, 0.24);
        background: rgba(236, 244, 255, 0.9);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.6;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 20px;
      }

      .action {
        appearance: none;
        border: 1px solid rgba(76, 106, 151, 0.16);
        border-radius: 18px;
        min-height: 52px;
        padding: 0 18px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .action-primary {
        background: #2d5dba;
        color: #f7fbff;
      }

      .action-secondary {
        background: rgba(255, 255, 255, 0.86);
        color: var(--ink);
      }

      .sheet-footnote {
        margin-top: 14px;
        color: #7b8eaa;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <section class="launch-stage">
      <div class="launch-badge" aria-hidden="true"></div>
    </section>

    <section class="launch-sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-eyebrow">腾讯导航</div>
      <h1>{{ route_title }}</h1>
      <p>正在为你打开腾讯地图。若当前环境无法直接唤起 App，可继续改用网页查看这条路线。</p>

      <div class="status-box" id="statusBox">正在尝试打开腾讯地图 App...</div>

      <div class="actions">
        <button type="button" class="action action-primary" id="retryAppButton">打开腾讯地图 App</button>
        <a class="action action-secondary" href="{{ tencent_export.href }}">改用网页打开腾讯路线</a>
      </div>

      <div class="sheet-footnote">如果你当前在微信开发者工具里，这里不会真的唤起手机上的腾讯地图 App，真机测试才会走到那条链路。</div>
    </section>

    <script>
      const appHref = {{ tencent_export.app_href|tojson }};
      const browserHref = {{ tencent_export.href|tojson }};
      const statusBox = document.getElementById("statusBox");
      const retryAppButton = document.getElementById("retryAppButton");

      function updateStatus(text) {
        statusBox.textContent = text;
      }

      function isDevtools() {
        return /wechatdevtools/i.test(window.navigator.userAgent || "");
      }

      function tryOpenApp() {
        if (!appHref) {
          updateStatus("当前路线还没有可用的腾讯导航链接。");
          return;
        }

        updateStatus("正在尝试打开腾讯地图 App，请稍候...");
        window.location.href = appHref;

        window.setTimeout(() => {
          updateStatus("如果没有跳转到腾讯地图 App，说明当前环境拦截了第三方 App 唤起。你可以继续用网页打开腾讯路线。" + (browserHref ? "" : ""));
        }, 1400);
      }

      retryAppButton.addEventListener("click", tryOpenApp);

      if (isDevtools()) {
        updateStatus("当前在微信开发者工具里，无法验证第三方 App 唤起。请在真机中测试，或先用网页打开腾讯路线。");
      } else {
        tryOpenApp();
      }
    </script>
  </body>
</html>
