<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">桓仁图卡</title>
  <desc id="desc">用于辽宁摩旅路线页面的桓仁打卡节点视觉图卡。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#203c69" />
      <stop offset="100%" stop-color="#f3b36b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <circle cx="610" cy="118" r="66" fill="#ffd889" opacity="0.92" />
  <path d="M0 380 C130 330 230 300 340 320 C462 344 586 416 800 372 L800 600 L0 600 Z" fill="#2d466d" opacity="0.78" />
  <path d="M0 450 C180 410 320 422 430 448 C556 478 650 516 800 500 L800 600 L0 600 Z" fill="#17324d" opacity="0.9" />
  <rect x="108" y="350" width="130" height="130" rx="18" fill="#f6efe1" opacity="0.92" />
  <rect x="266" y="320" width="156" height="160" rx="18" fill="#f6efe1" opacity="0.86" />
  <g fill="#f8f5ef">
    <text x="56" y="90" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" letter-spacing="6">STOP & REST</text>
    <text x="56" y="158" font-family="Helvetica Neue, Arial, sans-serif" font-size="60" font-weight="700">桓仁</text>
    <text x="56" y="208" font-family="Helvetica Neue, Arial, sans-serif" font-size="26">晚间补给节点 · 山路后休整</text>
  </g>
</svg>