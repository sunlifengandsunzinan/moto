    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <circle cx="628" cy="120" r="70" fill="#fff1bc" opacity="0.92" />
  <path d="M0 350 C180 330 286 302 402 330 C552 366 652 414 800 390 L800 600 L0 600 Z" fill="#7dad82" opacity="0.84" />
  <path d="M0 450 C160 482 296 488 416 470 C536 452 654 446 800 468 L800 600 L0 600 Z" fill="#d8f2e8" opacity="0.95" />
