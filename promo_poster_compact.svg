<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFE4D2"/>
      <stop offset="0.5" stop-color="#F8F3EA"/>
      <stop offset="1" stop-color="#E8D9C2"/>
    </linearGradient>
    <linearGradient id="panel" x1="180" y1="130" x2="1420" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FFF9F1" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="soft" x1="220" y1="580" x2="1380" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6E8D2" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#FFF8EE" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="118" y="88" width="1364" height="824" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#4C3816" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="180" cy="150" r="180" fill="#B98948" fill-opacity="0.16"/>
  <circle cx="1430" cy="180" r="120" fill="#B98948" fill-opacity="0.08"/>
  <circle cx="1250" cy="860" r="180" fill="#B98948" fill-opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="140" y="110" width="1320" height="780" rx="32" fill="url(#panel)"/>
    <rect x="140.5" y="110.5" width="1319" height="779" rx="31.5" stroke="#8D6634" stroke-opacity="0.14"/>
  </g>

  <rect x="190" y="156" width="252" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.75" stroke="#8D6634" stroke-opacity="0.12"/>
  <text x="214" y="186" fill="#9D6A2A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" letter-spacing="2">辽宁摩旅路线助手 · MVP</text>

  <text x="190" y="286" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="74" font-weight="700">辽宁摩旅路线</text>
  <text x="190" y="372" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="74" font-weight="700">导航 打卡 养车</text>

  <text x="190" y="446" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28">适合辽宁摩友日常转发的轻量工具：</text>
  <text x="190" y="490" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28">看路线、查补给、接高德、记想去、做打卡。</text>

  <g>
    <rect x="980" y="170" width="380" height="96" rx="24" fill="#FFFCF7" fill-opacity="0.86" stroke="#8D6634" stroke-opacity="0.14"/>
    <text x="1012" y="222" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">群主可直接转发</text>
    <text x="1012" y="252" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20">路线和执行信息一张图说清。</text>

    <rect x="980" y="284" width="380" height="96" rx="24" fill="#FFFCF7" fill-opacity="0.86" stroke="#8D6634" stroke-opacity="0.14"/>
    <text x="1012" y="336" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">骑手打开就能用</text>
    <text x="1012" y="366" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20">不用解释太多，扫码就能看。</text>

    <rect x="980" y="398" width="380" height="96" rx="24" fill="#FFFCF7" fill-opacity="0.86" stroke="#8D6634" stroke-opacity="0.14"/>
    <text x="1012" y="450" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">后续还能持续扩内容</text>
    <text x="1012" y="480" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20">路线、点位、补给、打卡会越积越全。</text>
  </g>

  <g>
    <rect x="190" y="590" width="360" height="150" rx="24" fill="#FFFFFF" fill-opacity="0.8" stroke="#8D6634" stroke-opacity="0.14"/>
    <text x="222" y="635" fill="#9D6A2A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20">01</text>
    <text x="222" y="694" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">路线浏览</text>
    <text x="222" y="730" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22">经典路线、亮点、行程一眼看完。</text>

    <rect x="580" y="590" width="360" height="150" rx="24" fill="#FFFFFF" fill-opacity="0.8" stroke="#8D6634" stroke-opacity="0.14"/>
    <text x="612" y="635" fill="#9D6A2A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20">02</text>
    <text x="612" y="694" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">导航衔接</text>
    <text x="612" y="730" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22">高德逐点导航，路上更省心。</text>

    <rect x="970" y="590" width="430" height="330" rx="24" fill="#FFFCF7" fill-opacity="0.92" stroke="#8D6634" stroke-opacity="0.14"/>
    <rect x="1080" y="645" width="210" height="210" rx="18" fill="#FFFFFF" stroke="#9D6A2A" stroke-dasharray="12 10" stroke-width="2"/>
    <text x="1144" y="748" fill="#9D6A2A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">小程序</text>
    <text x="1154" y="786" fill="#9D6A2A" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">二维码</text>
    <text x="1020" y="605" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">扫码打开</text>
    <text x="1020" y="892" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20">群主转发时可直接替换这里的二维码</text>
  </g>

  <g>
    <rect x="190" y="790" width="750" height="130" rx="24" fill="url(#soft)" stroke="#8D6634" stroke-opacity="0.14"/>
    <text x="222" y="844" fill="#1E1B17" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">推荐转发文案</text>
    <text x="222" y="890" fill="#6E6458" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="24">辽宁摩旅路线、导航、打卡都在这里，扫码直接看。</text>
